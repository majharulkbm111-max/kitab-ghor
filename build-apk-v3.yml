name: Build APK v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          rm -rf www && mkdir www
          cp index.html icon-192.png icon-512.png www/

      - name: Prepare icon and splash sources
        run: |
          mkdir -p assets
          cp cap-icon-only.png assets/icon-only.png
          cp cap-icon-foreground.png assets/icon-foreground.png
          cp cap-splash.png assets/splash.png
          python3 - <<'PY'
          import zlib, struct
          w = h = 1024
          raw = zlib.compress((b'\x00' + bytes([5, 62, 30]) * w) * h, 9)
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          open('assets/icon-background.png', 'wb').write(png)
          PY

      - name: Splash and background settings
        run: |
          python3 - <<'PY'
          import json
          p = 'capacitor.config.json'
          c = json.load(open(p, encoding='utf-8'))
          c['backgroundColor'] = '#053e1e'
          c.setdefault('plugins', {}).setdefault('SplashScreen', {}).update({'launchShowDuration': 250, 'launchFadeOutDuration': 150})
          json.dump(c, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          echo '--- capacitor.config.json (SplashScreen) ---'
          grep -n -A6 SplashScreen capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash
        run: >
          npx --yes @capacitor/assets generate --android
          --iconBackgroundColor '#053e1e' --iconBackgroundColorDark '#053e1e'
          --splashBackgroundColor '#053e1e' --splashBackgroundColorDark '#053e1e'

      - name: Green splash and window theme (no icon)
        run: |
          python3 - <<'PY'
          import re, pathlib, xml.etree.ElementTree as ET
          res = pathlib.Path('android/app/src/main/res')
          (res / 'values' / 'kg_colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="kg_bg">#053e1e</color>\n</resources>\n',
              encoding='utf-8')
          p = res / 'values' / 'styles.xml'
          s = p.read_text(encoding='utf-8')
          def add_items(text, style, items):
              m = re.search(r'(<style\s+name="%s"[^>]*>)(.*?)(</style>)' % re.escape(style), text, re.S)
              if not m:
                  print('style not found:', style)
                  return text
              body = m.group(2)
              for name, _ in items:
                  body = re.sub(r'\s*<item\s+name="%s"[^>]*>.*?</item>' % re.escape(name), '', body, flags=re.S)
              body = body.rstrip() + ''.join('\n        <item name="%s">%s</item>' % (n, v) for n, v in items) + '\n    '
              return text[:m.start()] + m.group(1) + body + m.group(3) + text[m.end():]
          (res / 'drawable').mkdir(parents=True, exist_ok=True)
          (res / 'drawable' / 'kg_splash_blank.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="#00000000" />\n    <size android:width="1dp" android:height="1dp" />\n</shape>\n',
              encoding='utf-8')
          launch = [('windowSplashScreenBackground', '@color/kg_bg'), ('android:windowBackground', '@color/kg_bg'), ('windowSplashScreenAnimatedIcon', '@drawable/kg_splash_blank')]
          n = add_items(s, 'AppTheme.NoActionBarLaunch', launch)
          n = add_items(n, 'AppTheme.NoActionBar', [('android:windowBackground', '@color/kg_bg')])
          try:
              ET.fromstring(n.encode('utf-8'))
              p.write_text(n, encoding='utf-8')
              print('styles.xml patched')
          except ET.ParseError as e:
              print('XML invalid, left unchanged:', e)
          PY

      - name: Show applied splash settings
        run: |
          echo '--- styles.xml ---'
          grep -n 'windowSplashScreen\|windowBackground' android/app/src/main/res/values/styles.xml || true
          ls android/app/src/main/res/drawable/kg_splash_blank.xml android/app/src/main/res/values/kg_colors.xml

      - name: Sync
        run: npx cap sync android

      - name: Set version code
        run: |
          VC=$(( $(date +%s) / 60 ))
          sed -E -i "s/versionCode( *=)? *[0-9]+/versionCode $VC/" android/app/build.gradle
          grep -n versionCode android/app/build.gradle

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kitab-ghor.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitab-ghor-apk
          path: kitab-ghor.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v3-${{ github.run_number }}" kitab-ghor.apk \
            --title "Kitab Ghor APK v3 #${{ github.run_number }}" \
            --notes "Build v3 #${{ github.run_number }}" \
            --prerelease
